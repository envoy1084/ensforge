name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm pack:check
      - name: Test published package tarballs
        run: pnpm test:packages

  integration:
    name: Contract integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENSFORGE_TEST_IMAGE: ghcr.io/envoy1084/ensforge-devnet@sha256:63415642daad6f3486d305b5660a0b9c659203fc20194bafb50b6b1e1bedeef3
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - name: Pull pinned ENS devnet image
        run: docker pull "${ENSFORGE_TEST_IMAGE}"
      - name: Build integration dependencies
        run: pnpm --filter @ensforge/test-env... build
      - name: Verify seeded ENS devnet
        run: pnpm test:integration
