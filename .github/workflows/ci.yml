name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm pack:check
      - name: Test published package tarballs
        run: pnpm test:packages

  integration:
    name: Contract integration
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENSFORGE_TEST_IMAGE: ghcr.io/envoy1084/ensforge-devnet@sha256:5efb35e1f12153c605d37a913a162580749f56fe4a270466f7c62fbf927bcfeb
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
      - name: Pull pinned ENS devnet image
        run: docker pull "${ENSFORGE_TEST_IMAGE}"
      - name: Build integration dependencies
        run: pnpm --filter @ensforge/test-env... build
      - name: Verify seeded ENS devnet
        run: pnpm test:integration

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - name: Create release pull request or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
