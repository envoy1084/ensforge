name: Publish devnet image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-devnet-image
  cancel-in-progress: false

env:
  CONTRACTS_COMMIT: 09bf3ac64a6fb1b215573c019b17e8c501bb3ca0

jobs:
  publish:
    name: Publish ENS devnet
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ensforge-devnet"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${CONTRACTS_COMMIT:0:7}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pinned ENS contracts
        uses: actions/checkout@v7
        with:
          repository: ensdomains/contracts-v2
          ref: ${{ env.CONTRACTS_COMMIT }}
          path: .repos/ens-contracts-v2
          submodules: recursive
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish devnet image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .repos/ens-contracts-v2
          file: .repos/ens-contracts-v2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ env.CONTRACTS_COMMIT }}
            ${{ steps.metadata.outputs.image }}:v2-${{ steps.metadata.outputs.short_commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.CONTRACTS_COMMIT }}
            org.opencontainers.image.title=Ensforge ENS devnet
            org.opencontainers.image.description=Pinned combined ENS v1 and ENS v2 integration-test devnet
          cache-from: type=gha,scope=ensforge-devnet-${{ steps.metadata.outputs.short_commit }}
          cache-to: type=gha,scope=ensforge-devnet-${{ steps.metadata.outputs.short_commit }},mode=max
          provenance: mode=max
          sbom: true

      - name: Write published image summary
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHORT_COMMIT: ${{ steps.metadata.outputs.short_commit }}
        run: |
          {
            echo "## ENS devnet image published"
            echo
            echo "- Tag: \`${IMAGE}:v2-${SHORT_COMMIT}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Immutable image: \`${IMAGE}@${DIGEST}\`"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
