name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Verify tested commit is current
        id: tested-commit
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "${TESTED_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "A newer main commit exists; its CI run will handle the release."
          fi

      - name: Setup pnpm and Node.js
        if: steps.tested-commit.outputs.current == 'true'
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Create release pull request or publish to npm
        if: steps.tested-commit.outputs.current == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
