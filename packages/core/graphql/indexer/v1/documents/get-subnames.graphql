query V1GetSubnames(
  $id: ID!
  $first: Int!
  $where: Domain_filter
  $orderBy: Domain_orderBy!
  $orderDirection: OrderDirection!
) {
  _meta {
    block {
      number
    }
  }
  domain(id: $id) {
    subdomains(first: $first, where: $where, orderBy: $orderBy, orderDirection: $orderDirection) {
      ...V1IndexedNameFields
    }
  }
}
