fragment V1IndexedNameFields on Domain {
  id
  name
  labelName
  labelhash
  parent {
    id
  }
  owner {
    id
  }
  registrant {
    id
  }
  resolvedAddress {
    id
  }
  resolver {
    address
  }
  createdAt
  expiryDate
  subdomainCount
  isMigrated
  ttl
  registration {
    registrant {
      id
    }
    registrationDate
    expiryDate
  }
  wrappedOwner {
    id
  }
  wrappedDomain {
    owner {
      id
    }
    fuses
    expiryDate
  }
}
