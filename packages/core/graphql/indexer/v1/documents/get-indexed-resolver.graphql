query V1GetIndexedResolver($address: Bytes!, $first: Int!) {
  _meta {
    block {
      number
    }
  }
  resolvers(first: $first, where: { address: $address }) {
    ...V1ResolverBindingFields
  }
}

query V1GetIndexedResolverBinding($address: Bytes!, $namehash: String!) {
  _meta {
    block {
      number
    }
  }
  resolvers(first: 1, where: { address: $address, domain: $namehash }) {
    ...V1ResolverBindingFields
  }
}
