query V1GetEvents(
  $domainFirst: Int!
  $registrationFirst: Int!
  $resolverFirst: Int!
  $domainSkip: Int!
  $registrationSkip: Int!
  $resolverSkip: Int!
  $domainWhere: DomainEvent_filter!
  $registrationWhere: RegistrationEvent_filter!
  $resolverWhere: ResolverEvent_filter!
  $orderDirection: OrderDirection!
) {
  _meta {
    block {
      number
    }
  }
  domainEvents(
    first: $domainFirst
    skip: $domainSkip
    where: $domainWhere
    orderBy: blockNumber
    orderDirection: $orderDirection
  ) {
    __typename
    id
    blockNumber
    transactionID
    domain {
      id
      name
    }
    ... on Transfer {
      owner {
        id
      }
    }
    ... on WrappedTransfer {
      owner {
        id
      }
    }
    ... on NewOwner {
      owner {
        id
      }
    }
    ... on NewResolver {
      resolver {
        address
      }
    }
    ... on NewTTL {
      ttl
    }
    ... on NameWrapped {
      owner {
        id
      }
      fuses
      expiryDate
    }
    ... on NameUnwrapped {
      owner {
        id
      }
    }
    ... on FusesSet {
      fuses
    }
    ... on ExpiryExtended {
      expiryDate
    }
  }
  registrationEvents(
    first: $registrationFirst
    skip: $registrationSkip
    where: $registrationWhere
    orderBy: blockNumber
    orderDirection: $orderDirection
  ) {
    __typename
    id
    blockNumber
    transactionID
    registration {
      domain {
        id
        name
      }
      cost
    }
    ... on NameRegistered {
      registrant {
        id
      }
      expiryDate
    }
    ... on NameRenewed {
      expiryDate
    }
    ... on NameTransferred {
      newOwner {
        id
      }
    }
  }
  resolverEvents(
    first: $resolverFirst
    skip: $resolverSkip
    where: $resolverWhere
    orderBy: blockNumber
    orderDirection: $orderDirection
  ) {
    __typename
    id
    blockNumber
    transactionID
    resolver {
      id
      address
      domain {
        id
        name
      }
    }
    ... on AddrChanged {
      addr {
        id
      }
    }
    ... on MulticoinAddrChanged {
      coinType
      multicoinAddress: addr
    }
    ... on TextChanged {
      key
      value
    }
    ... on ContenthashChanged {
      hash
    }
    ... on AbiChanged {
      contentType
    }
    ... on PubkeyChanged {
      x
      y
    }
    ... on InterfaceChanged {
      interfaceID
      implementer
    }
    ... on NameChanged {
      name
    }
    ... on AuthorisationChanged {
      owner
      target
      isAuthorized
    }
    ... on VersionChanged {
      version
    }
  }
}
