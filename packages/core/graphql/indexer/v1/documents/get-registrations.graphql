query V1GetRegistrations(
  $first: Int!
  $skip: Int!
  $where: Registration_filter!
  $orderBy: Registration_orderBy!
  $orderDirection: OrderDirection!
) {
  _meta {
    block {
      number
    }
  }
  registrations(
    first: $first
    skip: $skip
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    id
    labelName
    registrationDate
    expiryDate
    cost
    registrant {
      id
    }
    domain {
      id
      name
      owner {
        id
      }
    }
  }
}
