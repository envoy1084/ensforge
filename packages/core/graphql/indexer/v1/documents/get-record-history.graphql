query V1GetRecordHistory(
  $first: Int!
  $skip: Int!
  $where: ResolverEvent_filter!
  $orderDirection: OrderDirection!
) {
  _meta {
    block {
      number
    }
  }
  resolverEvents(
    first: $first
    skip: $skip
    where: $where
    orderBy: id
    orderDirection: $orderDirection
  ) {
    __typename
    id
    blockNumber
    transactionID
    resolver {
      id
      address
    }
    ... on AddrChanged {
      addr {
        id
      }
    }
    ... on MulticoinAddrChanged {
      coinType
      multicoinAddress: addr
    }
    ... on TextChanged {
      key
      value
    }
    ... on ContenthashChanged {
      hash
    }
    ... on AbiChanged {
      contentType
    }
    ... on PubkeyChanged {
      x
      y
    }
    ... on InterfaceChanged {
      interfaceID
      implementer
    }
    ... on NameChanged {
      name
    }
    ... on AuthorisationChanged {
      owner
      target
      isAuthorized
    }
    ... on VersionChanged {
      version
    }
  }
}
