query V1GetIndexedRecords($id: ID!, $domainId: String!, $first: Int!) {
  _meta {
    block {
      number
    }
  }
  domain(id: $id) {
    resolver {
      id
    }
  }
  resolvers(first: $first, where: { domain: $domainId }) {
    id
    address
    texts
    coinTypes
    contentHash
    events(first: 1000, orderBy: blockNumber, orderDirection: desc) {
      __typename
      ... on AbiChanged {
        contentType
      }
      ... on AuthorisationChanged {
        owner
        target
        isAuthorized
      }
      ... on InterfaceChanged {
        interfaceID
        implementer
      }
      ... on NameChanged {
        name
      }
      ... on PubkeyChanged {
        x
        y
      }
      ... on VersionChanged {
        version
      }
    }
  }
}
