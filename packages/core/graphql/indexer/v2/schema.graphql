"""
An Ethereum account (address)
"""
type Account {
  """
  Domains owned by this account
  """
  domains: [Domain!]!

  """
  Block number of the earliest observation across protocols. Zero if the account row was populated by backfill (no first-observation block was recorded).
  """
  firstSeenBlock: Int!

  """
  Unix timestamp (seconds) of the earliest observation across protocols. Zero if unknown.
  """
  firstSeenTimestamp: Int!

  """
  Ethereum address
  """
  id: String!

  """
  Reverse-resolved primary name for this address (V1 ReverseRegistrar + NameChanged path). Null if not claimed.
  """
  primaryName: String

  """
  ENSIP-3 forward verification of `primaryName` (Task 05). Additive — does NOT alter `primaryName`. VERIFIED = the name's forward resolution (via the Universal Resolver when configured) points back to this address; MISMATCH = it resolves to a different address; INVALID_NAME = the claimed name is not ENSIP-15 normalized; NOT_FOUND = no resolver/record; UNVERIFIED = the on-chain read reverted / errored / not checked. Null unless PRIMARY_VERIFY_ENABLED, and computed only for single-entity lookups (never per-row in a list).
  """
  primaryNameVerification: PrimaryNameVerification

  """
  Registrations made by this account
  """
  registrations(first: Int, skip: Int): [Registration!]!

  """
  True if this address has ever been observed acting under the V1 protocol (owner, registrant, role grantee, transfer recipient, or operator).
  """
  seenV1: Boolean!

  """
  True if this address has ever been observed acting under the V2 protocol.
  """
  seenV2: Boolean!

  """
  V1 NameWrapper wrapped-domain records owned by this account.
  """
  wrappedDomains(first: Int, skip: Int): [WrappedDomain!]!
}

"""
Filter input for the `accounts` query (subgraph parity). All fields are optional;
fields combine with AND semantics. `id`/`id_in` match exact addresses; `seenV1`/`seenV2`
filter by the per-protocol observation flag.
"""
input AccountFilter {
  """
  Exact address match.
  """
  id: String

  """
  Address in list (up to 1000).
  """
  id_in: [String!]

  """
  Restrict to addresses observed under V1 (true) or never observed under V1 (false).
  """
  seenV1: Boolean

  """
  Restrict to addresses observed under V2 (true) or never observed under V2 (false).
  """
  seenV2: Boolean
}

"""
Sort key for the `accounts` query.
"""
enum Account_orderBy {
  """
  First-observation block (the earlier of V1/V2 observations).
  """
  firstSeenBlock

  """
  Lexicographic order on the 0x-prefixed address.
  """
  id
}

"""
Typed payload for `AddressChanged` events (multi-coin AddressChanged signature).
"""
type AddressChangedData {
  """
  Address value (hex for ETH, bytes hex for other chains).
  """
  address: String

  """
  ENSIP-9 coin type.
  """
  coinType: Int

  """
  Namehash that the address record applies to.
  """
  namehash: String

  """
  Resolver contract address.
  """
  resolver: String
}

"""
A resolver alias mapping (from OwnedResolver)
"""
type Alias {
  """
  Source DNS name
  """
  fromName: String!

  """
  Destination DNS name
  """
  toName: String!
}

"""
A coin address record with coin type (SLIP-44)
"""
type CoinAddress {
  """
  Address value for this coin type
  """
  address: String!

  """
  SLIP-44 coin type (e.g., 60 for ETH, 0 for BTC, 501 for SOL). DEPRECATED: prefer `coinTypeBig` — ENSIP-11 L2 coin types (0x80000000 | chainId) exceed Int32 and will overflow. Kept for back-compat.
  """
  coinType: Int!

  """
  Decimal-string coin type. Use this instead of `coinType` to safely represent ENSIP-11 L2 coin types that exceed Int32.
  """
  coinTypeBig: String!
}

"""
Deployment coverage declaration (ensv2 extension).
"""
type Coverage {
  """
  EVM chain id this deployment indexes.
  """
  chainId: Int!

  """
  Per-protocol indexed positions.
  """
  protocols: [ProtocolCoverage!]!

  """
  True only when finality data shows the indexed head behind the chain's safe point.
  """
  stale: Boolean!
}

"""
An ENS domain name
"""
type Domain {
  """
  Canonical token ID (without version bits)
  """
  canonicalId: String

  """
  Timestamp when domain was created
  """
  createdAt: Int!

  """
  Events associated with this domain
  """
  events(
    first: Int
    orderBy: Event_orderBy
    orderDirection: OrderDirection
    where: EventFilter
  ): [Event!]!

  """
  Count of events associated with this domain
  """
  eventsCount: Int!

  """
  Timestamp when domain expires. For V1 .eth 2LDs, includes the 90-day grace period (`BaseRegistrar.expires + 90d`) to match subgraph semantics. The bare on-chain `expires` is still available via the parallel `Registration.expiryDate`.
  """
  expiryDate: Int

  """
  Finality tier of this domain's CURRENT state — how settled it is against chain finality. FINALIZED = the last change is at/below the finalized head (will not reorg); SAFE = at/below the safe head; HEAD = in the unsafe zone (may still reorg). Null when finality tracking is disabled (FINALITY_ENABLED off), so a client can distinguish 'unknown' from 'unsafe'.
  """
  finality: DomainFinality

  """
  Fuse bitmap from V1 NameWrapper (CANNOT_UNWRAP, PARENT_CANNOT_CONTROL, etc.). Null when not wrapped.
  """
  fuses: Int

  """
  Grace-period end for V1 .eth 2LDs (expiry + 90 days). Now an explicit-name alias for `Domain.expiryDate` (which itself includes the grace period for V1 .eth 2LDs per subgraph parity). Null for non-V1 names, non-.eth 2LDs, or names without expiry.
  """
  gracePeriodEnd: Int

  """
  Domain namehash (ERC-137 node hash), matching the ENS subgraph. The singular `domain(id:)` lookup still accepts a name or a namehash.
  """
  id: String!

  """
  V1-only provenance: true when the row's most recent update came from the legacy pre-2020 ENS Registry (0x314159…); false when it's been touched by the canonical post-2020 Registry (0x00…2e1e) or for V2 names.
  """
  isLegacy: Boolean!

  """
  Whether this domain has been migrated to V2
  """
  isMigrated: Boolean!

  """
  Whether the name passes ENSIP-15 normalization (computed at query time)
  """
  isNormalized: Boolean!

  """
  Whether this domain is reachable via canonical top-down resolution.
    False when an ancestor label's subregistry pointer has moved away from
    the subregistry contract that originally minted this domain (orphaned
    subtree), when the domain has been LabelUnregistered, or when an
    ancestor expiry has passed. Default GraphQL queries filter
    `isReachable: true` — pass `where: { includeUnreachable: true }` to
    include orphans.
  """
  isReachable: Boolean!

  """
  Whether this name is currently wrapped in V1 NameWrapper. When true, the `owner` field returns the wrapped-token owner (EOA), NOT the NameWrapper contract address — this is a deliberate divergence from the ENS subgraph for client convenience. Subgraph clients that need the NameWrapper-as-owner shape should query the on-chain `ownerOf()` directly.
  """
  isWrapped: Boolean!

  """
  Label only (e.g., 'vitalik' for 'vitalik.eth')
  """
  labelName: String

  """
  Keccak256 hash of the label. Non-null: this indexer only materializes a Domain once its label is known (it never creates tokenId-only rows like the subgraph/ENSNode), so clients need no null guard.
  """
  labelhash: String!

  """
  Full domain name (e.g., 'vitalik.eth')
  """
  name: String

  """
  ENSIP-15 normalized name (null if normalization fails)
  """
  normalizedName: String

  """
  Current owner of the domain
  """
  owner: Account!

  """
  Parent domain
  """
  parent: Domain

  """
  ENS protocol version this domain belongs to ("v1" = legacy ENS, "v2" = ENSv2).
  """
  protocol: String!

  """
  Original registrant of the domain
  """
  registrant: Account

  """
  Timestamp when domain was registered
  """
  registrationDate: Int

  """
  Address this domain resolves to
  """
  resolvedAddress: Account

  """
  Resolver contract for this domain
  """
  resolver: Resolver

  """
  Number of distinct accounts holding any label-scoped role on this label,
    matched by the label's canonical (version-independent) token id and its
    registry. Excludes the registry-wide root/admin role and empty role bitmaps,
    so it reflects only roles tied to this individual label.
  """
  roleHolderCount: Int!

  """
  Subgraph-compatible alias for `subdomainsCount`. Returns the same value.
  """
  subdomainCount: Int!

  """
  Subdomains of this domain
  """
  subdomains: [Domain!]!

  """
  Count of direct subdomains (one level only). Filtered by `isReachable = 1` AND excluding fully-burned names (owner=0 AND resolver=0, mirroring subgraph's GC deletion criteria). DEPRECATED: prefer `subdomainCount` (subgraph-compatible name).
  """
  subdomainsCount: Int!

  """
  The registry contract that manages this domain's subnames — the value of the parent registry's `getSubregistry(label)` pointer, set from `SubregistryUpdated`. Null when no subregistry is set (or for V1 names). This is the registry whose `referencedBy` includes this domain.
  """
  subregistry: RegistryInfo

  """
  ERC-721 token ID for this domain
  """
  tokenId: String

  """
  Token version number
  """
  tokenVersion: Int

  """
  ENS V1 Registry TTL (from `NewTTL` event). Null when never set or for V2 domains.
  """
  ttl: Int

  """
  Timestamp when this domain first became unreachable (null while reachable)
  """
  unreachableSince: Int

  """
  V1 NameWrapper wrapped-domain record. Null for V2 or unwrapped domains.
  """
  wrappedDomain: WrappedDomain

  """
  Wrapped owner (V1 NameWrapper EOA). Null when not wrapped.
  """
  wrappedOwner: Account

  """
  Wrapper expiry timestamp from V1 NameWrapper. Null when not wrapped.
  """
  wrapperExpiry: Int
}

"""
A connection to a list of Domains
"""
type DomainConnection {
  """
  A list of edges
  """
  edges: [DomainEdge!]!

  """
  Information to aid in pagination
  """
  pageInfo: PageInfo!

  """
  Total count of items (may be expensive to compute)
  """
  totalCount: Int
}

"""
An edge in a Domain connection
"""
type DomainEdge {
  """
  A cursor for use in pagination
  """
  cursor: String!

  """
  The item at the end of the edge
  """
  node: Domain!
}

"""
Filter criteria for querying domains
"""
input DomainFilter {
  """
  Boolean AND: every sub-filter must match. Each element is a full DomainFilter,
    nested recursively (subgraph parity). Combined with the other fields by AND.
  """
  and: [DomainFilter!]

  """
  Exact match on the version-masked canonical id (ensv2 extension; low 32 bits zeroed) — stable across token version bumps, for callers holding a possibly-stale token id. Accepts 0x-hex or decimal.
  """
  canonicalId: String

  """
  Subgraph-compatible alias for `expiry_gt`.
  """
  expiryDate_gt: Int

  """
  Subgraph-compatible alias for `expiry_gte`.
  """
  expiryDate_gte: Int

  """
  Subgraph-compatible alias for `expiry_lt`.
  """
  expiryDate_lt: Int

  """
  Subgraph-compatible alias for `expiry_lte`.
  """
  expiryDate_lte: Int

  """
  Filter by expiry date greater than (Unix timestamp)
  """
  expiry_gt: Int

  """
  Filter by expiry date greater than or equal (Unix timestamp)
  """
  expiry_gte: Int

  """
  Filter by expiry date less than (Unix timestamp)
  """
  expiry_lt: Int

  """
  Filter by expiry date less than or equal (Unix timestamp)
  """
  expiry_lte: Int

  """
  Filter by whether domain has direct subdomains (one level only)
  """
  hasSubdomains: Boolean

  """
  Include non-normalized domains (e.g. `Nick.eth`, `VITALIK`) that are
    hidden by default. Default false. Ignored when `isNormalized` is set.
  """
  includeUnnormalized: Boolean

  """
  Include domains that are unreachable via canonical resolution
    (orphaned by subregistry repoints, label unregistration, or expired
    ancestors). Default false — set true for audit / debug queries.
  """
  includeUnreachable: Boolean

  """
  Filter by migration status
  """
  isMigrated: Boolean

  """
  Filter by ENSIP-15 normalization status. When omitted, only normalized
    names are returned (non-normalized names like `Nick.eth` are hidden by
    default); set explicitly to `true`/`false` to filter, or pass
    `includeUnnormalized: true` to include both.
  """
  isNormalized: Boolean

  """
  Exact match on leftmost label (subgraph parity).
  """
  labelName: String

  """
  Partial label match (contains).
  """
  labelName_contains: String

  """
  Case-insensitive partial label match.
  """
  labelName_contains_nocase: String

  """
  Label ends with suffix.
  """
  labelName_ends_with: String

  """
  Case-insensitive label-suffix match.
  """
  labelName_ends_with_nocase: String

  """
  Label in list (up to 1000 labels).
  """
  labelName_in: [String!]

  """
  Negated exact-label match.
  """
  labelName_not: String

  """
  Negated partial label match.
  """
  labelName_not_contains: String

  """
  Negated label-in-list (up to 1000 labels).
  """
  labelName_not_in: [String!]

  """
  Label starts with prefix.
  """
  labelName_starts_with: String

  """
  Case-insensitive label-prefix match.
  """
  labelName_starts_with_nocase: String

  """
  Exact name match (list filter). Unlike domain(id:), the domains/domainConnection list default-hides non-normalized, unreachable, and synthetic-root rows unless includeUnnormalized / includeUnreachable / isNormalized override.
  """
  name: String

  """
  Partial name match (contains)
  """
  name_contains: String

  """
  Case-insensitive partial name match
  """
  name_contains_nocase: String

  """
  Name ends with suffix
  """
  name_ends_with: String

  """
  Case-insensitive suffix match (subgraph parity).
  """
  name_ends_with_nocase: String

  """
  Filter by name in list (up to 1000 names)
  """
  name_in: [String!]

  """
  Negated exact-name match (subgraph parity).
  """
  name_not: String

  """
  Negated partial name match (subgraph parity).
  """
  name_not_contains: String

  """
  Negated name-in-list (subgraph parity, up to 1000 names).
  """
  name_not_in: [String!]

  """
  Name starts with prefix
  """
  name_starts_with: String

  """
  Case-insensitive prefix match (subgraph parity).
  """
  name_starts_with_nocase: String

  """
  Boolean OR: any sub-filter matches. Each element is a full DomainFilter, nested
    recursively (subgraph parity). The OR group is AND-combined with sibling fields,
    so `{ owner: X, or: [{...A}, {...B}] }` means `owner=X AND (A OR B)`. Default
    visibility (reachable/normalized/non-root) is applied once to the whole result.
  """
  or: [DomainFilter!]

  """
  Filter by owner address
  """
  owner: String

  """
  Nested-relation filter on owner Account (subgraph parity). E.g. `{owner_: {id_in: [...]}}`.
  """
  owner_: AccountFilter

  """
  Filter by owner address in list
  """
  owner_in: [String!]

  """
  Negated owner address match (subgraph parity).
  """
  owner_not: String

  """
  Negated owner-in-list (subgraph parity).
  """
  owner_not_in: [String!]

  """
  Registry contract address filter (ensv2 extension) — the V2 registry that owns this name's label. Combine with tokenId/canonicalId to scope a marketplace tokenId lookup to one registry.
  """
  registry: String

  """
  Filter by resolved address
  """
  resolvedAddress: String

  """
  Filter by resolver contract address
  """
  resolver: String

  """
  Filter by direct subdomain count greater than (one level only)
  """
  subdomainCount_gt: Int

  """
  Filter by direct subdomain count less than (one level only)
  """
  subdomainCount_lt: Int

  """
  Exact match on the current versioned ERC-1155 token id (ensv2 extension) — the labelhash with its low 32 bits replaced by the token's version counter, exactly what NFT platforms send. Accepts 0x-hex or decimal. Hashing is one-way, so this is the tokenId-to-name reverse path; combine with `registry` to scope to one registry contract.
  """
  tokenId: String
}

"""
How settled a domain's current state is against chain finality (finality-tiered reads).
"""
enum DomainFinality {
  """
  The last change is at/below the finalized head; it will not reorg.
  """
  FINALIZED

  """
  The last change is in the unsafe zone above the safe head; it may still reorg.
  """
  HEAD

  """
  The last change is at/below the safe head but above finalized.
  """
  SAFE
}

"""
Fields to order Domain results by
"""
enum Domain_orderBy {
  createdAt
  expiryDate
  id
  name
  registrationDate
}

"""
EAC (Enhanced Access Control) role assignment
"""
type EACRoleAssignment {
  """
  Account that has the role
  """
  account: String!

  """
  Block number when assigned
  """
  blockNumber: Int!

  """
  Contract that emitted the role event. Disambiguates shared resource values: ROOT (0x0) exists on every EAC-enabled contract, so a role row is only meaningful together with its contract.
  """
  contractAddress: String!

  """
  Assignment identifier
  """
  id: String!

  """
  Domain name this role applies to (null for global roles)
  """
  name: String

  """
  Human-readable names of the roles encoded in `roleBitmap`, decoded against the
    emitting contract's role table (resolver vs registry). Admin roles are suffixed
    with `_ADMIN` (e.g. `["SET_RESOLVER", "SET_RESOLVER_ADMIN"]`). Empty when no
    roles are set or the bitmap is unrecognized.
  """
  permissions: [String!]!

  """
  Resource (token ID) this role applies to
  """
  resource: String!

  """
  Role bitmap (hex string). Preserved verbatim for clients that decode it directly.
  """
  roleBitmap: String!

  """
  Timestamp when assigned
  """
  timestamp: Int!

  """
  Transaction hash
  """
  transactionHash: String!
}

