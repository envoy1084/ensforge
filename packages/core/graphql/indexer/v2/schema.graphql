  premium: String

  """
  Chain where registration occurred (v1 or v2)
  """
  protocol: String!

  """
  Referrer bytes32 hex from the 7-arg UnwrappedEthRegistrarController (V1) or V2 ETHRegistrar.NameRegistered. Null for older Controller variants or when no Controller event has been observed.
