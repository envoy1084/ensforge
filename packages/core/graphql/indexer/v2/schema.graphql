  """
  expiryUpdateds(
    first: Int
    orderBy: Event_orderBy
    orderDirection: OrderDirection
    skip: Int
    where: EventFilter
  ): [Event!]!

  """
  Subgraph parity: top-level `FusesSet` events. Inspect via `asFusesSet { ... }`.
  """
  fusesSets(
    first: Int
    orderBy: Event_orderBy
    orderDirection: OrderDirection
    skip: Int
    where: EventFilter
  ): [Event!]!

  """
  Subgraph parity: top-level `LabelRegistered` events. Inspect via `asLabelRegistered { ... }`.
  """
  labelRegistereds(
    first: Int
    orderBy: Event_orderBy
    orderDirection: OrderDirection
    skip: Int
    where: EventFilter
  ): [Event!]!

