"""
Typed payload for `Transfer` events. Spans V1 BaseRegistrar ERC721 (`tokenId` numeric), V1 NameWrapper ERC1155 (`id` is the wrapped namehash, with `operator`/`value`), V2 registry transfers, ERC1155 `TransferBatch` summaries (`count`), and V1 Registry `NewOwner` rows (`parentNode`/`labelhash`/`subdomain`/`owner`).
"""
type TransferData {
  """
  ERC1155 TransferBatch: number of tokens in the batch (per-token id/value are not stored).
  """
  count: Int

  """
  Sender address.
  """
  from: String

  """
  Token id: ERC721 tokenId as a decimal string, or wrapper/V2 token id (namehash for NameWrapper). Stringified to preserve u256 range.
  """
  id: String

  """
  V1 Registry NewOwner rows: labelhash of the subdomain label.
  """
  labelhash: String

  """
  ERC1155 operator address (V1 NameWrapper / V2 only).
  """
  operator: String

  """
  V1 Registry NewOwner rows: new owner address.
  """
  owner: String

  """
  V1 Registry NewOwner rows: parent node namehash.
  """
  parentNode: String

  """
  V1 Registry NewOwner rows: namehash of the created/reassigned subdomain node.
  """
  subdomain: String

  """
  Recipient address.
  """
  to: String

  """
  ERC1155 transfer amount (always 1 for ENS NameWrapper).
  """
  value: String
}

