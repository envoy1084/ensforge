  graphqlUrl: String!

  """
  Metadata identifier
  """
  id: String!

  """
  Resolver contract address
  """
  resolver: String!

  """
  Timestamp when metadata was set
  """
  timestamp: Int!

  """
  Transaction hash
  """
  transactionHash: String!
}

