    orderBy: Event_orderBy
    orderDirection: OrderDirection
    skip: Int
    where: EventFilter
  ): [Event!]!

  """
  Subgraph parity: top-level `NameRenewed` events. Inspect via `asNameRenewed { ... }`.
  """
  nameReneweds(
    first: Int
    orderBy: Event_orderBy
    orderDirection: OrderDirection
    skip: Int
    where: EventFilter
  ): [Event!]!

