  """
  Resolver contract address in list (up to 1000).
  """
  address_in: [String!]

  """
  Exact match on the bound name's namehash.
  """
  namehash: String

  """
  Restrict to a single protocol — `"v1"` or `"v2"`.
  """
  protocol: String
}

