  id: String!

  """
  Human-readable label from the Controller event preimage (e.g., 'vitalik'). Null when the Controller event has not been observed or the label preimage was lost.
  """
  labelName: String

  """
  Name of the registered domain
  """
  name: String!

  """
  Auction premium portion in wei, decimal-encoded u256 (String, see `cost`). \"0\" for legacy 5-arg LegacyEthRegistrarController (no auction-premium semantics) or null when the Controller event has not been observed.
