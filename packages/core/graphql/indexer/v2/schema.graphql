  """
  nameUnwrappeds(
    first: Int
    orderBy: Event_orderBy
    orderDirection: OrderDirection
    skip: Int
    where: EventFilter
  ): [Event!]!

  """
  Subgraph parity: top-level `NameWrapped` events. Inspect via `asNameWrapped { ... }`.
