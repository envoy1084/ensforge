  approvals(delegate: String, namehash: String): [ResolverApproval!]!

  """
  Get a single domain by name or namehash. Exact get: returns the row even if
    non-normalized (unlike domains/where.name, which default-hide non-normalized
    names); unreachable rows are still hidden (returns null). `atBlock` (ensv2
    extension) reconstructs the domain's state as of that block from the event
    log — V2 names only; scalar fields, `resolver { addr text(key:) contentHash }`
    and `resolvedAddress` are historical; list record fields return empty at-block;
    nested domain entities (parent/subdomains) reflect current state; an
    out-of-range block or a name without V2 event history resolves to null.
  """
  domain(atBlock: Int, id: String!): Domain

  """
  Get multiple domains with cursor-based pagination (recommended)
  """
  domainConnection(
    after: String
    before: String
    first: Int
    last: Int
    orderBy: Domain_orderBy
    orderDirection: OrderDirection
    where: DomainFilter
  ): DomainConnection!

  """
  Get multiple domains with pagination and filtering (legacy offset-based)
  """
  domains(
    first: Int
    orderBy: Domain_orderBy
    orderDirection: OrderDirection
    skip: Int
    where: DomainFilter
  ): [Domain!]!

  """
  Get events with cursor-based pagination (recommended)
  """
  eventConnection(
    after: String
    before: String
    first: Int
    last: Int
    orderBy: Event_orderBy
    orderDirection: OrderDirection
    where: EventFilter
  ): EventConnection!

  """
  Get events with pagination (legacy offset-based)
  """
  events(
    first: Int
    orderBy: Event_orderBy
    orderDirection: OrderDirection
    skip: Int
    where: EventFilter
  ): [Event!]!

  """
