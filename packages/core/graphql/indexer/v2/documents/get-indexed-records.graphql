query V2GetIndexedRecords($name: String!, $namehash: String!, $first: Int!, $protocol: String) {
  _meta {
    block {
      number
    }
  }
  byName: domain(id: $name) {
    resolver {
      id
    }
  }
  byNamehash: domain(id: $namehash) {
    resolver {
      id
    }
  }
  resolvers(first: $first, where: { namehash: $namehash, protocol: $protocol }) {
    id
    address
    texts
    coinTypes
    contentHash
    abis
    pubkey {
      x
      y
    }
    interfaces {
      interfaceId
    }
    reverseName
    version
  }
}
