query V2GetSubnames(
  $id: String!
  $first: Int!
  $skip: Int!
  $where: DomainFilter
  $orderBy: Domain_orderBy!
  $orderDirection: OrderDirection!
) {
  _meta {
    block {
      number
    }
  }
  domain(id: $id) {
    subregistry {
      labels(
        first: $first
        skip: $skip
        where: $where
        orderBy: $orderBy
        orderDirection: $orderDirection
      ) {
        ...V2IndexedNameFields
      }
    }
  }
}
