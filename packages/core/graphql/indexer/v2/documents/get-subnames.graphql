query V2GetSubnames(
  $id: String!
  $first: Int!
  $after: String
  $where: DomainFilter
  $orderBy: Domain_orderBy!
  $orderDirection: OrderDirection!
) {
  _meta {
    block {
      number
    }
  }
  domain(id: $id) {
    subregistry {
      labelConnection(
        first: $first
        after: $after
        where: $where
        orderBy: $orderBy
        orderDirection: $orderDirection
      ) {
        edges {
          cursor
          node {
            ...V2IndexedNameFields
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}
