query V2GetRegistryRoles(
  $registry: String!
  $account: String
  $resource: String
  $first: Int!
  $after: String
) {
  _meta {
    block {
      number
    }
  }
  roleConnection(
    contract: $registry
    protocol: "v2"
    account: $account
    resource: $resource
    first: $first
    after: $after
  ) {
    edges {
      cursor
      node {
        id
        account
        resource
        name
        roleBitmap
        permissions
        blockNumber
        timestamp
        transactionHash
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
