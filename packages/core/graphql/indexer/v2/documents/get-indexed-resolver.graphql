query V2GetIndexedResolver($address: String!, $protocol: String, $first: Int!) {
  _meta {
    block {
      number
    }
  }
  detail: resolver(id: $address) {
    address
    nodeCount
    aliasCount
    aliases {
      fromName
      toName
    }
    roleHolderCount
    roles {
      account
      resource
      name
      roleBitmap
      timestamp
    }
  }
  bindings: resolvers(first: $first, where: { address: $address, protocol: $protocol }) {
    ...V2ResolverBindingFields
  }
}

query V2GetIndexedResolverBinding($address: String!, $protocol: String, $namehash: String!) {
  _meta {
    block {
      number
    }
  }
  detail: resolver(id: $address) {
    address
    nodeCount
    aliasCount
    aliases {
      fromName
      toName
    }
    roleHolderCount
    roles {
      account
      resource
      name
      roleBitmap
      timestamp
    }
  }
  bindings: resolvers(
    first: 1
    where: { address: $address, protocol: $protocol, namehash: $namehash }
  ) {
    ...V2ResolverBindingFields
  }
}
