query V2GetRegistryLabels($address: String!, $first: Int!, $after: String) {
  _meta {
    block {
      number
    }
  }
  registry(address: $address) {
    labelConnection(first: $first, after: $after) {
      edges {
        cursor
        node {
          ...V2IndexedNameFields
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

query V2GetRegistryReferences($address: String!, $first: Int!, $after: String) {
  _meta {
    block {
      number
    }
  }
  registry(address: $address) {
    referencedByConnection(first: $first, after: $after) {
      edges {
        cursor
        node {
          ...V2IndexedNameFields
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
