query V2GetEvents(
  $first: Int!
  $after: String
  $where: EventFilter!
  $orderDirection: OrderDirection!
) {
  _meta {
    block {
      number
    }
  }
  eventConnection(
    first: $first
    after: $after
    where: $where
    orderBy: blockNumber
    orderDirection: $orderDirection
  ) {
    edges {
      cursor
      node {
        id
        type
        protocol
        name
        namehash
        blockNumber
        timestamp
        transactionHash
        contractAddress
        data
        key
        value
        asAddressChanged {
          address
          coinType
        }
        asExpiryUpdated {
          expiry
          node
          tokenId
        }
        asFusesSet {
          fuses
          node
        }
        asLabelRegistered {
          expiry
          name
          owner
          registry
          sender
          tokenId
        }
        asNameRegistered {
          baseCost
          cost
          expires
          label
          name
          owner
          premium
          referrer
        }
        asNameRenewed {
          expires
          id
        }
        asNameUnwrapped {
          node
          owner
        }
        asNameWrapped {
          expiry
          fuses
          node
          owner
        }
        asRegistryTransfer {
          node
          owner
        }
        asResolverUpdated {
          resolver
          sender
          tokenId
        }
        asReverseClaimed {
          address
          node
        }
        asTextChanged {
          key
          value
        }
        asTransfer {
          from
          id
          operator
          to
          value
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
