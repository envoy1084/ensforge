query V2GetOwnedNames(
  $address: String!
  $first: Int!
  $after: String
  $includeUnreachable: Boolean
) {
  _meta {
    block {
      number
    }
  }
  owned: domainConnection(
    first: $first
    after: $after
    where: { owner: $address, includeUnreachable: $includeUnreachable }
  ) {
    edges {
      node {
        ...V2IndexedNameFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query V2GetResolvedNames(
  $address: String!
  $first: Int!
  $after: String
  $includeUnreachable: Boolean
) {
  _meta {
    block {
      number
    }
  }
  resolved: domainConnection(
    first: $first
    after: $after
    where: { resolvedAddress: $address, includeUnreachable: $includeUnreachable }
  ) {
    edges {
      node {
        ...V2IndexedNameFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query V2GetRegistrationsForAddress($address: String!, $first: Int!, $after: String) {
  _meta {
    block {
      number
    }
  }
  registrations: registrationConnection(
    first: $first
    after: $after
    where: { registrant: $address }
  ) {
    edges {
      node {
        domain {
          ...V2IndexedNameFields
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query V2GetRolesForAddress($address: String!, $first: Int!, $after: String) {
  _meta {
    block {
      number
    }
  }
  roles: roleConnection(first: $first, after: $after, account: $address) {
    edges {
      node {
        name
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
