fragment V2IndexedNameFields on Domain {
  id
  protocol
  name
  labelName
  labelhash
  parent {
    id
    subregistry {
      address
    }
  }
  owner {
    id
  }
  registrant {
    id
  }
  resolvedAddress {
    id
  }
  resolver {
    address
  }
  createdAt
  expiryDate
  subdomainCount
  isMigrated
  ttl
  wrappedOwner {
    id
  }
  wrappedDomain {
    owner {
      id
    }
    fuses
    expiryDate
  }
  subregistry {
    address
  }
  canonicalId
  tokenId
  tokenVersion
  registrationDate
  gracePeriodEnd
  unreachableSince
  isNormalized
  isReachable
  isWrapped
  roleHolderCount
}
