query V2GetRegistryByAddress($address: String!) {
  _meta {
    block {
      number
    }
  }
  registry(address: $address) {
    ...V2RegistryFields
  }
}

query V2GetRegistryByName($name: String!) {
  _meta {
    block {
      number
    }
  }
  domain(id: $name) {
    subregistry {
      ...V2RegistryFields
    }
  }
}
