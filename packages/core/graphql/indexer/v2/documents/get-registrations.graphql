query V2GetRegistrations(
  $first: Int!
  $after: String
  $where: RegistrationFilter!
  $orderBy: Registration_orderBy!
  $orderDirection: OrderDirection!
) {
  _meta {
    block {
      number
    }
  }
  registrationConnection(
    first: $first
    after: $after
    where: $where
    orderBy: $orderBy
    orderDirection: $orderDirection
  ) {
    edges {
      cursor
      node {
        id
        protocol
        name
        labelName
        registrationDate
        expiryDate
        cost
        baseCost
        premium
        referrer
        registrant {
          id
        }
        domain {
          id
          owner {
            id
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
